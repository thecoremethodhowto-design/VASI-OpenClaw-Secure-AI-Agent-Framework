services:
  ollama:
    image: ollama/ollama@sha256:a61a8fd395dbb931cc8cb1b5da7a2510746575c87113fdc45b647ee59ef7f808
    container_name: vasi-ollama-local
    profiles:
      - local-ollama
    expose:
      - "11434"
    environment:
      # Ollama güvenlik ayarları
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - vasi-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # GPU kullanımı (opsiyonel)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  litellm:
    # ⚠️ DIGEST'İ KENDİN DOLDUR:
    #   docker pull ghcr.io/berriai/litellm:v1.98.0
    #   docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/berriai/litellm:v1.98.0
    #
    # NEDEN 1.99.0 DEGIL: 1.99.0 bir gun once yayinlandi. LiteLLM
    # Mart 2026'da tedarik zinciri saldirisina ugradi (1.82.7 / 1.82.8).
    # Yeni surumu hemen almak, o riski tekrarlamak olur. 1.98.0 on
    # gunluk ve toplulukca incelenmis durumda.
    image: ghcr.io/berriai/litellm@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
    container_name: vasi-litellm
    # Port YAYINLANMIYOR: proxy yalnizca vasi-network icinden erisilebilir.
    expose:
      - "4000"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    restart: unless-stopped
    networks:
      - vasi-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  vasi-core:
    build: .
    container_name: vasi-sandbox-guard
    env_file: .env
    volumes:
      - ./workspace:/app/workspace
    environment:
      # Varsayilan: Mac/host uzerinde zaten calisan Ollama'yi kullan.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      VASI_LOG_FILE: /tmp/vasi_audit.log
      VASI_NOTES_FILE: notlar/NOTES.md
      VASI_CHANNEL_STYLE_FILE: skills/youtube_icerik.md
      VASI_CODE_STYLE_FILE: skills/kod_yardimcisi.md
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      WEB_RADAR_ALLOWLIST: ${WEB_RADAR_ALLOWLIST:-}
      PENDING_ACTION_TTL_SECONDS: ${PENDING_ACTION_TTL_SECONDS:-600}
      GEMINI_DAILY_LIMIT_REQUESTS: ${GEMINI_DAILY_LIMIT_REQUESTS:-60}
      VASI_MODEL_GATEKEEPER: ${VASI_MODEL_GATEKEEPER:-qwen3:30b}
      VASI_MODEL_STRATEJI: ${VASI_MODEL_STRATEJI:-qwen3:30b}
      VASI_MODEL_TEKNIK: ${VASI_MODEL_TEKNIK:-qwen3:30b}
      VASI_MODEL_KOD: ${VASI_MODEL_KOD:-qwen3-coder:30b}
      VASI_MODEL_GORSEL: ${VASI_MODEL_GORSEL:-qwen3:30b}
      TZ: ${TZ:-Europe/Istanbul}
    restart: unless-stopped
    networks:
      - vasi-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

networks:
  vasi-network:
    driver: bridge
volumes:
  ollama_data: